name: Technical task
description: Infrastructure, tooling, security or architecture work that enables user stories.
title: "[TEC-XX] "
labels: ["type: technical", "epic: E0 Habilitadores técnicos"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task enables and why it is needed.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options: ["Must", "Should", "Could", "Won't"]
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: References
      description: Related ADRs or standards.
      placeholder: "ADR-007, OWASP ASVS V14"
